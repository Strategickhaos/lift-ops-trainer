[package]
name = "lift-ops-trainer"
version = "0.1.0"
edition = "2021"
authors = ["Strategickhaos"]
description = "Phone-first industrial lift operations trainer (boom / telehandler / forklift). Content as data → AST → multiple renderers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Strategickhaos/lift-ops-trainer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "trainer"
path = "src/bin/trainer.rs"

[[bin]]
name = "pack"
path = "src/bin/pack.rs"
